[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "designspecs-rag"
version = "0.1.0"
description = "RAG system for design specifications"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "chromadb",
    "docling",
    "tiktoken",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
] 